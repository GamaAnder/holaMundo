<!DOCTYPE html>
<html>
  <body style="background-color: lightblue;">
  <div class="login-container">
    <p></p>
    <form [formGroup]="formulario" (ngSubmit)="login()">
        <label class="form-label" >Correo:</label>
        <input class="form-control"  placeholder="test@ejemplo.com" type="correo" formControlName="correo">
        @if(formulario.get('correo')?.invalid 
        && formulario.get('correo')?.touched){
            <div> El correo es obligatorio</div> 
              
        }
        <br><br>
        <label  class="form-label" >Contrasena:</label>
        <input class="form-control" placeholder="Password" type="password" formControlName="contrasena">
        @if(formulario.get('contrasena')?.invalid 
        && formulario.get('contrasena')?.touched){
            <div> El contrasena es obligatorio</div>
        }
        <br><br>
        <div class="mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="dropdownCheck">
            <label class="form-check-label" for="dropdownCheck">
              Recuérdame
            </label>
          </div>
        </div>
        <br><br>
        <button type = "submit" class="btn btn-primary btn-lg">Ingresar</button>
    </form>
  </div>
  </body>
</html>
